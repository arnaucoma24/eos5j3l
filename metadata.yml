Status: In progress
Title: Ensemble-Conditioned Molecular Design
Description: Generates molecules matching the shape and pharmacophore profile of
  a reference compound, treating it as a distribution over conformers rather 
  than one fixed pose. Developed at AstraZeneca and Chalmers using flow matching
  with ensemble-conditioned guidance, trained on 300K GEOM-Drugs molecules with 
  CREST conformer ensembles and 35K PDB-derived protein-ligand complexes. 
  Connected validity stays above 0.97 and uniqueness above 0.99, and fingerprint
  similarity to the reference is low, so outputs are scaffold hops rather than 
  close analogues. Reported validation is computational only.
